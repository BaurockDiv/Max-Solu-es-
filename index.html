<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Max Company | Professional Discovery</title>

    <!-- Meta tags para App Nativo -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A plataforma de descoberta profissional da Max Company.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --app-height: 100%;
            --app-width: 100%;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            height: -webkit-fill-available;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Principal "Perfect Fit" */
        .mobile-frame {
            width: var(--app-width);
            height: var(--app-height);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #000;
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Desktop Mode: Centralizado e Proporcional */
        @media (min-width: 768px) {
            .mobile-frame {
                width: 430px;
                /* Largura padrão Pro Max */
                height: 90vh;
                border-radius: 3rem;
                border: 8px solid #1a1a1a;
                box-shadow: 0 0 100px rgba(0, 0, 0, 0.5);
            }
        }

        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .animate-gpu {
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        /* Fix para garantir que imagens e vídeos não "vazem" */
        img,
        video {
            max-width: 100%;
            height: auto;
        }
    </style>

    <script>
        // Sistema de Detecção e Ajuste de Tela (Perfect Fit)
        function updateAppDimensions() {
            const isMobile = window.innerWidth < 768;
            const doc = document.documentElement;

            if (isMobile) {
                doc.style.setProperty('--app-height', `${window.innerHeight}px`);
                doc.style.setProperty('--app-width', `${window.innerWidth}px`);
            } else {
                // No desktop usamos as dimensões fixas do frame
                doc.style.setProperty('--app-height', '90vh');
                doc.style.setProperty('--app-width', '430px');
            }
        }

        window.addEventListener('resize', updateAppDimensions);
        window.addEventListener('orientationchange', updateAppDimensions);
        document.addEventListener('DOMContentLoaded', updateAppDimensions);
        // IOS Fix
        window.addEventListener('load', () => setTimeout(updateAppDimensions, 100));
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "recharts": "https://esm.sh/recharts@^3.7.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
