<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Max Company | Professional Discovery</title>

    <!-- Meta tags para App Nativo -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="A plataforma de descoberta profissional da Max Company.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --app-height: 100dvh;
        }

        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            height: var(--app-height);
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Scroll suave e performance */
        .smooth-scroll {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Ajuste para telas com notch */
        .safe-area-bottom {
            padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem);
        }


        /* Container Principal Responsivo */
        .mobile-frame {
            width: 100%;
            height: var(--app-height);
            margin: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Desktop Adjustments used to be here but were removing functionality */


        /* Aceleração de Hardware */
        .animate-gpu {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
        }

        /* Ajuste de inputs para evitar zoom automático no iOS */
        input,
        select,
        textarea {
            font-size: 16px !important;
        }
    </style>

</head>

</body>

</html>
